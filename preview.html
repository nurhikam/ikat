<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikat — Preview Tema</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="engine/engine.css">
</head>
<body>

<main id="app"></main>

<script src="engine/engine.js"></script>
<script>
  // Harness preview: temanya dari ?theme=<slug>, jadi satu file bisa nampilin
  // semua tema tanpa bikin 11 halaman kembar. Undangan klien asli tetap nge-link
  // temanya langsung di <head> biar nggak ada kedipan sebelum CSS turun.
  var slug = new URLSearchParams(location.search).get('theme') || 'forest-lace';
  Ikat.init({ src: 'data/demo.json', theme: slug });
</script>

</body>
</html>
