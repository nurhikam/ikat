name: Deploy showcase to GitHub Pages

# Publishes the demo invitation as a public showcase. Client data never lives
# in this repo (see docs/DEPLOY.md) — only data/demo.json, which is fictional.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard against publishing real client data
        run: |
          stray=$(find data -name '*.json' ! -name 'demo.json' -print)
          if [ -n "$stray" ]; then
            echo "::error::client data must not live in this public repo:"
            echo "$stray"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - name: Stage the site
        run: |
          mkdir -p _site
          # Landing page jadi akar situs; demo undangan dan harness preview
          # ikut supaya tiap kartu tema di galeri membuka undangan sungguhan.
          cp site/index.html site/site.css _site/
          cp site/og.png _site/ 2>/dev/null || true
          cp site/galeri.html _site/ 2>/dev/null || true
          cp -r site/thumbs _site/
          cp demo.html preview.html _site/
          cp -r engine themes data assets _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
